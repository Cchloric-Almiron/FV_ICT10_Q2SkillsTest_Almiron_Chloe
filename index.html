<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Q2 Skills Test</title>
     <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cascadia+Code:ital,wght@0,200..700;1,200..700&family=Redaction+35:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>

    body{
        background-image:url('https://i.pinimg.com/736x/8e/8a/46/8e8a46c6498b95c1101477416bbafd1d.jpg');
        background-size:cover;
        background-repeat: no-repeat;
    }
    #MainBox{
        height:500px;
        width:500px;
        border-left:20px solid #EFA7A7;
        background-color: #ffd9725b;
        border-radius:20px;
        text-align:center;
        margin-left:auto;
        margin-right:auto;
        margin-top:100px;
        box-shadow: 5px 5px 5px #c17f7f;
        font-family:"Cascadia Code", monospace;
    }


</style>

</head>
<body>

    <div id="MainBox">
    <br>
    <h1 style ="font-family: 'Redaction 35' ,serif; margin-top:40px;">Nonmetals Checker</h1>
    <p>Enter your nonmetallic element symbol</p>

    <input type="text" id="element" placeholder="Enter element symbol">
    <hr>
    <input type="button" py-click="search_element" value="Search" class="btn btn-success">
    <input type="button" onclick="window.location.reload()" value="Cancel" class="btn btn-danger">

    <hr>


    <div id="result">
        <h3>Your Results:</h3>
        <p><b>Element Symbol:</b> <span id="symbol"></span></p>
        <p><b>Element Name:</b> <span id="name"></span></p>
        <p><b>Element Atomic Number:</b> <span id="atomic_number"></span></p>
        <p><b>Element Atomic Mass:</b> <span id="atomic_mass"></span></p>

    </div>


    <script type="py" src="main.py"></script>

    </div>
    
</body>
</html>
